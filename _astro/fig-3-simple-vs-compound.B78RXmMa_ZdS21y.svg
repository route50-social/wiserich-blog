    <text x="904" y="291.4" font-size="24" font-weight="700" fill="#d22030">복리 · 약 4,322만 원</text>
    <path d="M912 307.4V376" stroke="#d22030" stroke-width="2" stroke-dasharray="4 6"/>
    <text x="928" y="349.7" font-size="23" fill="#333d4b">차이 약 1,822만 원</text>
    <text x="904" y="408" font-size="24" font-weight="700" fill="#4e5968">단리 · 2,500만 원</text>

    <text x="64" y="656" font-size="22" fill="#4e5968">가정: 수익률이 매년 일정. 실선은 복리, 점선은 단리, 색칠한 부분은 이자에 다시 붙은 이자</text>
