    <polyline points="160 496 184 492.8 208 489.6 232 486.4 256 483.2 280 480 304 476.8 328 473.6 352 470.4 376 467.2 400 464 424 460.8 448 457.6 472 454.4 496 451.2 520 448 544 444.8 568 441.6 592 438.4 616 435.2 640 432 664 428.8 688 425.6 712 422.4 736 419.2 760 416 784 412.8 808 409.6 832 406.4 856 403.2 880 400" fill="none" stroke="#8b95a1" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="18 10"/>
    <polyline points="160 496 184 492.8 208 489.4 232 485.9 256 482.2 280 478.3 304 474.2 328 469.9 352 465.4 376 460.7 400 455.8 424 450.5 448 445.1 472 439.3 496 433.3 520 426.9 544 420.3 568 413.3 592 406 616 398.3 640 390.2 664 381.7 688 372.8 712 363.4 736 353.6 760 343.3 784 332.4 808 321.1 832 309.1 856 296.6 880 283.4" fill="none" stroke="#f04452" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="880" cy="283.4" r="9" fill="#f04452"/>
