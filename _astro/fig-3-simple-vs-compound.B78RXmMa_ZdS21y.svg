<!-- 본문 그림 3: 1,000만 원을 연 5%로 30년 굴릴 때 단리와 복리 비교 (세금·수수료 제외 계산값) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" role="img" aria-labelledby="fig3-title fig3-desc">
  <title id="fig3-title">단리와 복리, 30년 뒤의 차이</title>
  <desc id="fig3-desc">1,000만 원을 연 5%로 굴리면 단리는 매년 50만 원씩 늘어 30년 뒤 2,500만 원이 되고, 복리는 처음엔 단리와 비슷하다가 갈수록 가파르게 늘어 약 4,322만 원이 된다. 30년 뒤 차이는 약 1,822만 원이다.</desc>

  <rect width="1200" height="696" rx="16" fill="#fcf8f8"/>
  <rect x="1" y="1" width="1198" height="694" rx="16" fill="none" stroke="#eedcdc" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="38" font-weight="700" fill="#191f28">단리와 복리, 30년 뒤의 차이</text>
    <text x="64" y="140" font-size="25" fill="#4e5968">원금 1,000만 원을 연 5%로 굴릴 때 (세금·수수료 제외)</text>
    <text x="160" y="200" font-size="23" fill="#4e5968" text-anchor="middle">단위: 만 원</text>

    <path d="M160 496H880M160 432H880M160 368H880M160 304H880M160 240H880M400 240V560M640 240V560M880 240V560" stroke="#efe4e4" stroke-width="2"/>
    <g font-size="23" fill="#4e5968" text-anchor="end">
      <text x="144" y="568">0</text>
      <text x="144" y="504">1,000</text>
      <text x="144" y="440">2,000</text>
      <text x="144" y="376">3,000</text>
      <text x="144" y="312">4,000</text>
      <text x="144" y="248">5,000</text>
    </g>
    <g font-size="23" fill="#333d4b" text-anchor="middle">
      <text x="160" y="600">0년</text>
      <text x="400" y="600">10년</text>
      <text x="640" y="600">20년</text>
      <text x="880" y="600">30년</text>
    </g>
    <path d="M160 232V560H880" fill="none" stroke="#8b95a1" stroke-width="3"/>

    <!-- 복리와 단리 사이 = 이자에 붙은 이자 -->
