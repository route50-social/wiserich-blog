    <rect x="1078" y="410" width="34" height="26" rx="5"/><rect x="1122" y="410" width="34" height="26" rx="5"/><rect x="1166" y="410" width="34" height="26" rx="5"/><rect x="1254" y="410" width="34" height="26" rx="5"/><rect x="1298" y="410" width="34" height="26" rx="5"/>
    <rect x="1078" y="450" width="34" height="26" rx="5"/><rect x="1122" y="450" width="34" height="26" rx="5"/><rect x="1166" y="450" width="34" height="26" rx="5"/><rect x="1210" y="450" width="34" height="26" rx="5"/><rect x="1254" y="450" width="34" height="26" rx="5"/><rect x="1298" y="450" width="34" height="26" rx="5"/>
  </g>
  <rect x="1210" y="410" width="34" height="26" rx="5" fill="#fde2dd"/>
  <ellipse cx="1227" cy="423" rx="30" ry="24" fill="none" stroke="#f97362" stroke-width="5"/>
  <path d="M1238 400V340" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
  <path d="M1238 342L1284 356L1238 370Z" fill="#f5b83d"/>

  <!-- 가계부 노트 (가운데) -->
  <g filter="url(#shadow)">
    <path d="M300 600L790 560L800 860L320 880Z" fill="url(#page)"/>
    <path d="M790 560L1240 600L1230 870L800 860Z" fill="url(#page-right)"/>
  </g>
  <g transform="rotate(-4.5 545 720)">
    <g stroke="#e3dccb" stroke-width="3">
      <path d="M350 640H760M350 680H760M350 720H760M350 760H760M350 800H760"/>
    </g>
