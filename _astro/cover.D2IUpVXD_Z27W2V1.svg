<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="cover-title cover-desc">
  <!-- 표지: 책상 위에 펼친 가계부 노트와 연필, 계산기, 목표 날짜에 동그라미와 깃발을 표시한 탁상 달력 -->
  <title id="cover-title">가계부와 목표 달력이 놓인 책상</title>
  <desc id="cover-desc">연보라빛 벽 앞 나무 책상 위에 수입과 지출을 줄마다 적은 가계부 노트, 연필, 계산기가 놓여 있고, 뒤쪽 탁상 달력에는 날짜 하나에 동그라미와 작은 깃발이 표시되어 있다</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e1f2"/>
      <stop offset="1" stop-color="#cfcae6"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b48a"/>
      <stop offset="1" stop-color="#b88a5c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.92" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#e9e1cf"/>
    </linearGradient>
    <linearGradient id="page-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e1cf"/>
      <stop offset="0.08" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="calc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#2f3640"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5a3e22" flood-opacity="0.32"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a3e22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 배경: 벽과 책상 -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="900" fill="url(#light)"/>
  <g transform="translate(0 -90)">
  <rect y="520" width="1600" height="470" fill="url(#desk)"/>
  <rect y="520" width="1600" height="10" fill="#c99d6e"/>
  <path d="M0 600C400 590 900 615 1600 596M0 700C500 690 1000 712 1600 694M0 810C450 800 1100 822 1600 806" fill="none" stroke="#a87a4e" stroke-width="3" opacity="0.35"/>

  <!-- 탁상 달력 (뒤쪽) -->
  <g filter="url(#shadow)">
    <path d="M1010 540L1060 250H1350L1400 540Z" fill="#8f86b8"/>
    <rect x="1050" y="236" width="310" height="300" rx="14" fill="#ffffff"/>
    <rect x="1050" y="236" width="310" height="70" rx="14" fill="#f97362"/>
    <rect x="1050" y="286" width="310" height="20" fill="#f97362"/>
