    </g>
    <rect x="840" y="650" width="100" height="14" rx="7" fill="#f5b83d"/>
    <rect x="840" y="690" width="230" height="14" rx="7" fill="#c7c1e3"/>
    <rect x="840" y="730" width="170" height="14" rx="7" fill="#c7c1e3"/>
    <rect x="840" y="770" width="120" height="14" rx="7" fill="#c7c1e3"/>
    <path d="M1140 760l16 18 32-40" fill="none" stroke="#f97362" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#9ca3af">
    <circle cx="793" cy="590" r="7"/><circle cx="794" cy="630" r="7"/><circle cx="795" cy="670" r="7"/><circle cx="796" cy="710" r="7"/><circle cx="797" cy="750" r="7"/><circle cx="798" cy="790" r="7"/><circle cx="799" cy="830" r="7"/>
  </g>

  <!-- 연필 -->
  <g filter="url(#soft)" transform="rotate(-28 980 600)">
    <rect x="860" y="588" width="250" height="26" rx="4" fill="#f5b83d"/>
    <rect x="860" y="588" width="250" height="9" fill="#f9cd6c"/>
    <rect x="836" y="588" width="28" height="26" rx="5" fill="#f3a9a0"/>
    <rect x="858" y="588" width="14" height="26" fill="#a3a3a3"/>
    <path d="M1110 588L1150 601L1110 614Z" fill="#f1d9b5"/>
    <path d="M1137 597L1150 601L1137 605Z" fill="#374151"/>
  </g>

  <!-- 계산기 (왼쪽 뒤) -->
  <g filter="url(#shadow)" transform="rotate(-8 300 470)">
    <rect x="190" y="330" width="230" height="300" rx="24" fill="url(#calc)"/>
    <rect x="214" y="356" width="182" height="64" rx="10" fill="#d9e4d0"/>
    <rect x="300" y="380" width="80" height="18" rx="5" fill="#9fb38f"/>
    <g fill="#e5e7eb">
      <rect x="214" y="440" width="38" height="34" rx="8"/><rect x="262" y="440" width="38" height="34" rx="8"/><rect x="310" y="440" width="38" height="34" rx="8"/>
      <rect x="214" y="484" width="38" height="34" rx="8"/><rect x="262" y="484" width="38" height="34" rx="8"/><rect x="310" y="484" width="38" height="34" rx="8"/>
      <rect x="214" y="528" width="38" height="34" rx="8"/><rect x="262" y="528" width="38" height="34" rx="8"/><rect x="310" y="528" width="38" height="34" rx="8"/>
      <rect x="214" y="572" width="86" height="34" rx="8"/><rect x="310" y="572" width="38" height="34" rx="8"/>
