<!-- 본문 그림 2: 자산과 부채를 한 장에 적고 순자산을 계산하는 재무상태표 예시 (가상 예시) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">한 장으로 보는 내 자산과 부채</title>
  <desc id="fig2-desc">왼쪽 자산 칸에 입출금 통장 120만 원, 적금 300만 원, 전월세 보증금 1,000만 원으로 합계 1,420만 원, 오른쪽 부채 칸에 학자금 대출 600만 원, 신용카드 할부 잔액 80만 원으로 합계 680만 원을 적고, 아래에 자산에서 부채를 뺀 순자산 740만 원을 표시한 표. 가상 예시.</desc>

  <rect width="1200" height="700" rx="16" fill="#fbfaf6"/>
  <rect x="1" y="1" width="1198" height="698" rx="16" fill="none" stroke="#ddd8c8" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="38" font-weight="700" fill="#24211a">한 장으로 보는 내 자산과 부채</text>
    <text x="64" y="140" font-size="25" fill="#4d4839">기준일을 정해 잔액을 적고, 몇 달마다 같은 양식으로 다시 적습니다 (가상 예시)</text>

    <!-- 자산 -->
    <rect x="64" y="184" width="512" height="336" rx="20" fill="#ffffff" stroke="#cfc8b3" stroke-width="2"/>
    <rect x="64" y="184" width="512" height="72" rx="20" fill="#ece9fb"/>
    <rect x="64" y="236" width="512" height="20" fill="#ece9fb"/>
    <text x="96" y="232" font-size="28" font-weight="700" fill="#2f2770">자산 (가진 것)</text>
    <g font-size="25" fill="#2f2c24">
      <text x="96" y="312">입출금 통장</text>
      <text x="96" y="368">적금</text>
      <text x="96" y="424">전월세 보증금</text>
    </g>
    <g font-size="25" fill="#2f2c24" text-anchor="end">
      <text x="544" y="312">120만 원</text>
      <text x="544" y="368">300만 원</text>
      <text x="544" y="424">1,000만 원</text>
    </g>
    <path d="M96 448H544" stroke="#cfc8b3" stroke-width="2"/>
    <text x="96" y="492" font-size="26" font-weight="700" fill="#24211a">합계</text>
    <text x="544" y="492" font-size="28" font-weight="700" fill="#2f2770" text-anchor="end">1,420만 원</text>

    <!-- 부채 -->
    <rect x="624" y="184" width="512" height="336" rx="20" fill="#ffffff" stroke="#cfc8b3" stroke-width="2"/>
    <rect x="624" y="184" width="512" height="72" rx="20" fill="#f3efe4"/>
    <rect x="624" y="236" width="512" height="20" fill="#f3efe4"/>
    <text x="656" y="232" font-size="28" font-weight="700" fill="#4d4839">부채 (갚아야 할 것)</text>
    <g font-size="25" fill="#2f2c24">
      <text x="656" y="312">학자금 대출</text>
      <text x="656" y="368">신용카드 할부 잔액</text>
    </g>
    <g font-size="25" fill="#2f2c24" text-anchor="end">
      <text x="1104" y="312">600만 원</text>
      <text x="1104" y="368">80만 원</text>
    </g>
    <path d="M656 448H1104" stroke="#cfc8b3" stroke-width="2"/>
    <text x="656" y="492" font-size="26" font-weight="700" fill="#24211a">합계</text>
    <text x="1104" y="492" font-size="28" font-weight="700" fill="#4d4839" text-anchor="end">680만 원</text>

    <!-- 순자산 -->
    <rect x="64" y="552" width="1072" height="96" rx="20" fill="#4b3fa6"/>
    <text x="96" y="612" font-size="27" font-weight="700" fill="#ffffff">순자산 = 자산 1,420만 원 − 부채 680만 원</text>
    <text x="1104" y="614" font-size="34" font-weight="700" fill="#ffffff" text-anchor="end">740만 원</text>
  </g>
</svg>
