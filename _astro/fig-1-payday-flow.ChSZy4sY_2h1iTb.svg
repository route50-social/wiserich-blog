<!-- 그림 1: 월급날 기준 네 통장으로 돈이 나뉘는 구조 (가상 예시) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 832" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">월급날 네 통장으로 나뉘는 흐름</title>
  <desc id="fig1-desc">매달 25일 실수령 250만 원이 월급통장에 들어오면 26일에 생활비 통장 110만 원, 비상금 통장 20만 원, 투자 통장 40만 원이 자동이체된다. 월급통장에 남은 80만 원에서 27일 이후 월세 50만 원, 통신비 7만 원, 보험료 10만 원, 교통·구독 13만 원이 자동납부된다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M5 2 L12 7 L5 12" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1200" height="832" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="830" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="96" font-size="40" font-weight="700" fill="#1e293b">월급날 네 통장으로 나뉘는 흐름</text>
    <text x="64" y="144" font-size="26" fill="#475569">가상 예시: 매달 25일 실수령 250만 원</text>

    <!-- 월급통장 -->
    <rect x="64" y="200" width="368" height="336" rx="16" fill="#ede9fe" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="108" cy="244" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="108" y="253" font-size="26" font-weight="700" fill="#334155" text-anchor="middle">1</text>
    <text x="148" y="254" font-size="30" font-weight="700" fill="#1e293b">월급통장</text>
    <text x="96" y="320" font-size="24" fill="#334155">25일 월급 입금</text>
    <text x="96" y="376" font-size="44" font-weight="700" fill="#1e293b">250만 원</text>
    <path d="M96 416 H400" stroke="#c4b5fd" stroke-width="2"/>
    <text x="96" y="460" font-size="24" fill="#334155">자동이체 후 남는 돈</text>
    <text x="96" y="504" font-size="32" font-weight="700" fill="#1e293b">80만 원</text>

    <!-- 26일 자동이체 표시 -->
    <circle cx="488" cy="188" r="22" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="488" y="197" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">2</text>
    <text x="520" y="197" font-size="24" fill="#334155">26일 자동이체</text>

    <g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M440 248 H688"/>
      <path d="M440 368 H688"/>
      <path d="M440 488 H688"/>
    </g>

    <!-- 받는 통장 세 개 -->
    <g stroke="#94a3b8" stroke-width="2">
      <rect x="704" y="200" width="432" height="96" rx="16" fill="#fef9c3"/>
      <rect x="704" y="320" width="432" height="96" rx="16" fill="#e0f2fe"/>
      <rect x="704" y="440" width="432" height="96" rx="16" fill="#dcfce7"/>
    </g>
    <g font-size="28" font-weight="700" fill="#1e293b">
      <text x="736" y="240">생활비 통장</text>
      <text x="736" y="360">비상금 통장</text>
      <text x="736" y="480">투자 통장</text>
    </g>
    <g font-size="22" fill="#334155">
      <text x="736" y="276">체크카드로 한 달 생활</text>
      <text x="736" y="396">카드 연결 없이 모으기</text>
      <text x="736" y="516">증권·ISA·연금 계좌</text>
    </g>
    <g font-size="32" font-weight="700" fill="#1e293b" text-anchor="end">
      <text x="1104" y="260">110만 원</text>
      <text x="1104" y="380">20만 원</text>
      <text x="1104" y="500">40만 원</text>
    </g>

    <!-- 고정지출 자동납부 -->
    <path d="M248 544 V600" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="64" y="616" width="1072" height="128" rx="16" fill="#ffedd5" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="108" cy="660" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="108" y="669" font-size="26" font-weight="700" fill="#334155" text-anchor="middle">3</text>
    <text x="148" y="670" font-size="28" font-weight="700" fill="#1e293b">27일 이후 고정지출 자동납부</text>
    <text x="148" y="716" font-size="22" fill="#334155">월세 50만 원 · 통신비 7만 원 · 보험료 10만 원 · 교통·구독 13만 원</text>
    <text x="1104" y="690" font-size="32" font-weight="700" fill="#1e293b" text-anchor="end">80만 원</text>

    <text x="64" y="792" font-size="22" fill="#475569">금액은 이해를 돕기 위한 가상 예시입니다.</text>
  </g>
</svg>
