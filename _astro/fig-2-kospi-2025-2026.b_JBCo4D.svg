<!-- 그림 2: 2024년 말~2026년 10월 14일 코스피 지수 시점별 막대그래프 (자료: 한국은행 2026년 9월 금융시장 동향) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">코스피 지수 추이, 2024년 말~2026년 10월 14일</title>
  <desc id="fig2-desc">코스피는 2024년 말 2,399에서 2025년 말 4,214로 75.7% 올랐고, 2026년 7월 말 6,595, 8월 말 6,820, 9월 말 6,838로 2026년 들어 9월 말까지 62.3% 더 올랐다. 그 뒤 10월 14일 6,009로 9월 말보다 12.1% 내렸다. 직전 시점보다 오른 막대는 빨강, 내린 막대는 파랑이다.</desc>

  <rect width="1200" height="800" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="798" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1e293b">코스피, 크게 오른 뒤 2주 만에 12% 하락</text>
    <text x="64" y="132" font-size="24" fill="#475569">시점별 지수(기말 기준, 마지막은 10월 14일), 배당을 뺀 가격 지수</text>

    <!-- 눈금선: 0~8,000, 1포인트 = 0.05px -->
    <g stroke="#e2e8f0" stroke-width="2">
      <path d="M160 200 H1136"/>
      <path d="M160 300 H1136"/>
      <path d="M160 400 H1136"/>
      <path d="M160 500 H1136"/>
    </g>
    <path d="M160 600 H1136" stroke="#94a3b8" stroke-width="2"/>
    <g font-size="22" fill="#475569" text-anchor="end">
      <text x="144" y="208">8,000</text>
      <text x="144" y="308">6,000</text>
      <text x="144" y="408">4,000</text>
      <text x="144" y="508">2,000</text>
      <text x="144" y="608">0</text>
    </g>

    <!-- 막대: 너비 96, 칸 너비 약 162.7 -->
    <rect x="193" y="480" width="96" height="120" rx="6" fill="#8b95a1"/>
    <rect x="356" y="389.3" width="96" height="210.7" rx="6" fill="#f04452"/>
    <rect x="519" y="270.2" width="96" height="329.8" rx="6" fill="#f04452"/>
    <rect x="681" y="259" width="96" height="341" rx="6" fill="#f04452"/>
    <rect x="844" y="258.1" width="96" height="341.9" rx="6" fill="#f04452"/>
    <rect x="1007" y="299.5" width="96" height="300.5" rx="6" fill="#3182f6"/>

    <!-- 값 -->
    <g font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">
      <text x="241" y="466">2,399</text>
      <text x="404" y="375">4,214</text>
      <text x="567" y="256">6,595</text>
      <text x="729" y="245">6,820</text>
      <text x="892" y="244">6,838</text>
      <text x="1055" y="285">6,009</text>
    </g>

    <!-- 가로축 -->
    <g font-size="22" fill="#334155" text-anchor="middle">
      <text x="241" y="638">2024년</text>
      <text x="241" y="666">말</text>
      <text x="404" y="638">2025년</text>
      <text x="404" y="666">말</text>
      <text x="567" y="638">2026년</text>
      <text x="567" y="666">7월 말</text>
      <text x="729" y="666">8월 말</text>
      <text x="892" y="666">9월 말</text>
      <text x="1055" y="666">10월 14일</text>
    </g>

    <!-- 변화율 상자 -->
    <rect x="184" y="196" width="320" height="140" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <g font-size="22">
      <text x="208" y="236" fill="#334155">2025년 한 해</text>
      <text x="480" y="236" fill="#d22030" font-weight="700" text-anchor="end">+75.7%</text>
      <text x="208" y="274" fill="#334155">2026년 1~9월</text>
      <text x="480" y="274" fill="#d22030" font-weight="700" text-anchor="end">+62.3%</text>
      <text x="208" y="312" fill="#334155">9월 말→10월 14일</text>
      <text x="480" y="312" fill="#1b64da" font-weight="700" text-anchor="end">−12.1%</text>
    </g>

    <!-- 범례 -->
    <g font-size="22" fill="#334155">
      <rect x="64" y="704" width="24" height="24" rx="4" fill="#f04452"/>
      <text x="100" y="724">직전 시점보다 상승</text>
      <rect x="320" y="704" width="24" height="24" rx="4" fill="#3182f6"/>
      <text x="356" y="724">직전 시점보다 하락</text>
      <rect x="576" y="704" width="24" height="24" rx="4" fill="#8b95a1"/>
      <text x="612" y="724">기준 시점</text>
    </g>
    <text x="64" y="768" font-size="22" fill="#475569">자료: 한국은행 「2026년 9월 금융시장 동향」(2026-10-15 발표)</text>
  </g>
</svg>
