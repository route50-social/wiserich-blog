<!-- 표지: 비가 내리는 창밖과 현관 선반 위에 놓인 우산, 구급상자, 잠금 상자로 '갑작스러운 일에 대비해 미리 떼어 둔 돈'을 나타냅니다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">비 오는 날을 대비한 현관 선반</title>
  <desc id="cover-desc">비가 내리는 저녁 창문 아래 나무 선반에 접힌 우산, 구급상자, 작은 잠금 상자가 나란히 놓여 있고 따뜻한 스탠드 불빛이 이들을 비춘다.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a4f" />
      <stop offset="1" stop-color="#1c2737" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b6582" />
      <stop offset="1" stop-color="#7d93ab" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.55" />
      <stop offset="0.6" stop-color="#ffb84d" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9875a" />
      <stop offset="1" stop-color="#7a5232" />
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8f86" />
      <stop offset="1" stop-color="#256b63" />
    </linearGradient>
    <linearGradient id="kit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ea" />
      <stop offset="1" stop-color="#d9d3c6" />
    </linearGradient>
    <linearGradient id="umbrella" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5f59" />
      <stop offset="0.5" stop-color="#2f7d75" />
      <stop offset="1" stop-color="#1f5f59" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b111a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 벽 -->
  <rect width="1600" height="900" fill="url(#wall)" />

  <!-- 창문과 비 -->
  <g filter="url(#shadow)">
    <rect x="300" y="80" width="1000" height="470" rx="10" fill="#d7c7b0" />
  </g>
  <rect x="324" y="104" width="952" height="422" fill="url(#sky)" />
  <g fill="#3b5068" opacity="0.8">
    <rect x="324" y="380" width="180" height="146" />
    <rect x="520" y="340" width="120" height="186" />
    <rect x="660" y="400" width="220" height="126" />
    <rect x="900" y="360" width="140" height="166" />
    <rect x="1060" y="410" width="216" height="116" />
  </g>
  <g fill="#ffcf7a" opacity="0.55">
    <rect x="548" y="370" width="16" height="20" /><rect x="588" y="370" width="16" height="20" />
    <rect x="548" y="420" width="16" height="20" /><rect x="930" y="390" width="16" height="20" />
    <rect x="980" y="440" width="16" height="20" /><rect x="380" y="410" width="16" height="20" />
  </g>
  <g stroke="#dbe6f2" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <path d="M360 130 l-14 40" /><path d="M430 190 l-14 40" /><path d="M500 140 l-14 40" />
    <path d="M570 220 l-14 40" /><path d="M640 120 l-14 40" /><path d="M710 260 l-14 40" />
    <path d="M780 160 l-14 40" /><path d="M850 230 l-14 40" /><path d="M920 130 l-14 40" />
    <path d="M990 280 l-14 40" /><path d="M1060 170 l-14 40" /><path d="M1130 240 l-14 40" />
    <path d="M1200 140 l-14 40" /><path d="M1250 300 l-14 40" /><path d="M400 300 l-14 40" />
    <path d="M610 320 l-14 40" /><path d="M820 330 l-14 40" /><path d="M1040 330 l-14 40" />
  </g>
  <g fill="#e8f0f8" opacity="0.45">
    <ellipse cx="460" cy="260" rx="5" ry="8" /><ellipse cx="760" cy="210" rx="5" ry="8" />
    <ellipse cx="1010" cy="200" rx="5" ry="8" /><ellipse cx="1180" cy="330" rx="5" ry="8" />
    <ellipse cx="660" cy="450" rx="5" ry="8" />
  </g>
  <rect x="794" y="104" width="12" height="422" fill="#d7c7b0" />
  <rect x="324" y="309" width="952" height="12" fill="#d7c7b0" />

  <!-- 스탠드 불빛 -->
  <circle cx="1356" cy="520" r="440" fill="url(#lampGlow)" />

  <!-- 선반 -->
  <g filter="url(#shadow)">
    <rect x="160" y="648" width="1280" height="40" rx="6" fill="url(#shelf)" />
  </g>
  <rect x="184" y="688" width="1232" height="212" fill="#6e4a2e" />
  <rect x="184" y="688" width="1232" height="20" fill="#4f3420" />
  <g fill="#7d5636" stroke="#5c3c24" stroke-width="4">
    <rect x="216" y="728" width="376" height="150" rx="8" />
    <rect x="612" y="728" width="376" height="150" rx="8" />
    <rect x="1008" y="728" width="376" height="150" rx="8" />
  </g>
  <g fill="#d9b277">
    <rect x="364" y="790" width="80" height="14" rx="7" />
    <rect x="760" y="790" width="80" height="14" rx="7" />
    <rect x="1156" y="790" width="80" height="14" rx="7" />
  </g>

  <!-- 접힌 우산 (선반에 기대어 섬) -->
  <g filter="url(#shadow)">
    <path d="M392 300 C372 300 352 330 350 360 L330 648 L418 648 L432 360 C430 330 412 300 392 300 Z" fill="url(#umbrella)" />
    <path d="M392 300 L374 648" stroke="#174944" stroke-width="3" />
    <path d="M392 300 L404 648" stroke="#174944" stroke-width="3" />
    <rect x="352" y="440" width="72" height="16" rx="8" fill="#174944" />
    <rect x="386" y="250" width="12" height="56" fill="#3a3a3a" />
    <path d="M392 250 C392 200 450 200 450 240" fill="none" stroke="#6b4a2f" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- 구급상자 -->
  <g filter="url(#shadow)">
    <rect x="560" y="500" width="300" height="148" rx="16" fill="url(#kit)" />
    <rect x="660" y="476" width="100" height="32" rx="10" fill="none" stroke="#8a8478" stroke-width="10" />
    <rect x="560" y="540" width="300" height="10" fill="#c8c1b2" />
    <rect x="690" y="556" width="40" height="80" rx="4" fill="#3f8f86" />
    <rect x="670" y="576" width="80" height="40" rx="4" fill="#3f8f86" />
  </g>

  <!-- 잠금 상자 -->
  <g filter="url(#shadow)">
    <rect x="940" y="448" width="320" height="200" rx="18" fill="url(#box)" />
    <rect x="940" y="448" width="320" height="56" rx="18" fill="#2e7a72" />
    <rect x="940" y="490" width="320" height="14" fill="#256b63" />
    <rect x="1072" y="530" width="56" height="72" rx="10" fill="#e9b04f" />
    <circle cx="1100" cy="556" r="9" fill="#5a3d14" />
    <rect x="1096" y="560" width="8" height="24" rx="3" fill="#5a3d14" />
    <rect x="980" y="612" width="240" height="8" rx="4" fill="#1d5751" />
  </g>

  <!-- 스탠드 -->
  <g filter="url(#shadow)">
    <rect x="1300" y="636" width="112" height="16" rx="8" fill="#3b3b3b" />
    <rect x="1348" y="420" width="16" height="220" fill="#4a4a4a" />
    <path d="M1280 330 L1432 330 L1404 430 L1308 430 Z" fill="#e9b04f" />
    <rect x="1308" y="426" width="96" height="10" fill="#c58f2f" />
  </g>
</svg>
