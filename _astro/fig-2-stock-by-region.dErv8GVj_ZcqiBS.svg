<!-- 그림 2: 지역별 주택 유형 구성 100% 막대그래프 (2025 인구주택총조사) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 888" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">지역별 주택 유형 구성</title>
  <desc id="fig2-desc">2025년 11월 1일 기준 주택 수 비중. 전국은 아파트 65.8%, 연립·다세대 14.1%, 단독주택 19.0%, 비주거용 건물 내 주택 1.0%. 서울은 아파트 60.7%, 연립·다세대 29.6%, 단독 8.8%, 비주거 0.8%. 수도권은 아파트 68.1%, 연립·다세대 21.8%, 단독 9.3%, 비주거 0.7%. 비수도권은 아파트 63.8%, 연립·다세대 7.3%, 단독 27.5%, 비주거 1.3%.</desc>
  <rect width="1200" height="888" rx="16" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="886" rx="16" fill="none" stroke="#d6d3d1" stroke-width="2"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
