<!-- 그림 1: 빵집 주식회사의 주식 1만 주를 100주씩 100칸으로 나눠 세 주주의 몫을 표시 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 848" role="img" aria-labelledby="fig1-title fig1-desc">
  <title id="fig1-title">빵집 주식회사의 주식 1만 주와 세 주주의 몫</title>
  <desc id="fig1-desc">자본금 1억 원을 1주 1만 원짜리 주식 1만 주로 나눈 빵집 주식회사. 한 칸이 100주인 100칸 가운데 지민이 50칸(5,000주, 지분율 50%), 서준이 30칸(3,000주, 30%), 하은이 20칸(2,000주, 20%)을 갖는다.</desc>

  <rect width="1200" height="848" rx="16" fill="#f8fafc" />
  <rect x="1" y="1" width="1198" height="846" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" />

