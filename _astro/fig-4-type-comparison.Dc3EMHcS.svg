<!-- 그림 4: 아파트·빌라·단독·다가구·오피스텔의 장점, 관리, 시세 확인, 전세사기 피해 비중, 세금 비교표 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 952" role="img" aria-labelledby="fig4-title fig4-desc">
  <title id="fig4-title">주택 유형별 장단점 비교</title>
  <desc id="fig4-desc">아파트는 단지 시설과 되팔기가 쉽고, 관리 주체가 있으며 대단지는 관리비 공개 의무가 있고, 같은 단지 거래로 시세 비교가 쉽다. 전세사기 피해 비중은 13.5%, 취득세는 주택 세율 1~3%다. 빌라(연립·다세대)는 서울 주택의 4분의 1을 차지하는 흔한 대안이지만 관리 주체가 없는 경우가 많고 비슷한 거래를 찾기 어렵다. 전세사기 피해 비중은 31.3%이고 소형 신축은 주택 수 특례가 있다. 단독·다가구는 공간을 자유롭게 쓰고 임대수입을 낼 수 있지만 집주인이 직접 관리하고 건물마다 사정이 달라 시세 파악이 가장 어렵다. 다중주택 포함 전세사기 피해 비중은 29.8%이고 다가구는 1주택으로 본다. 오피스텔은 1인 가구가 많이 찾는 소형 주거이며 관리비 항목 확인이 필요하고 같은 건물 거래로 비교할 수 있다. 전세사기 피해 비중은 20.8%이고 취득세 4.6%, 주거용이면 주택 수에 들어갈 수 있다.</desc>

  <rect width="1200" height="952" rx="16" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="950" rx="16" fill="none" stroke="#d6d3d1" stroke-width="2"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
    <text x="64" y="88" font-size="36" font-weight="700" fill="#1c1917">주택 유형별 장단점 비교</text>
    <text x="64" y="132" font-size="24" fill="#57534e">같은 예산이라도 관리, 시세 확인, 전세 위험, 세금이 다릅니다</text>

    <!-- 머리글 -->
    <rect x="232" y="168" width="218" height="72" rx="12" fill="#d9e4f2"/>
    <rect x="458" y="168" width="218" height="72" rx="12" fill="#fde7c2"/>
    <rect x="684" y="168" width="218" height="72" rx="12" fill="#dcefd9"/>
    <rect x="910" y="168" width="226" height="72" rx="12" fill="#e6defa"/>
    <g font-size="26" font-weight="700" text-anchor="middle">
      <text x="341" y="214" fill="#1e3a5f">아파트</text>
      <text x="567" y="200" fill="#7a3e0a">빌라</text>
      <text x="567" y="230" font-size="22" fill="#7a3e0a">(연립·다세대)</text>
      <text x="793" y="214" fill="#1f3d1d">단독·다가구</text>
      <text x="1023" y="214" fill="#3b1d78">오피스텔</text>
    </g>

    <!-- 행 배경 -->
    <rect x="64" y="256" width="1072" height="104" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
    <rect x="64" y="368" width="1072" height="104" rx="10" fill="#f5f5f4"/>
    <rect x="64" y="480" width="1072" height="104" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
    <rect x="64" y="592" width="1072" height="104" rx="10" fill="#f5f5f4"/>
    <rect x="64" y="704" width="1072" height="104" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>

    <!-- 행 이름 -->
    <g font-size="24" font-weight="700" fill="#1c1917">
      <text x="88" y="316">장점</text>
      <text x="88" y="428">관리</text>
      <text x="88" y="526">시세 확인</text>
      <text x="88" y="626">전세사기</text>
      <text x="88" y="658">피해 비중</text>
      <text x="88" y="764">세금</text>
    </g>

    <!-- 장점 -->
    <g font-size="22" fill="#292524">
      <text x="248" y="300">단지 시설,</text>
      <text x="248" y="332">되팔기 쉬움</text>
      <text x="474" y="300">서울 주택의</text>
      <text x="474" y="332">4분의 1, 흔한 대안</text>
      <text x="700" y="300">공간을 자유롭게,</text>
      <text x="700" y="332">임대수입 가능</text>
      <text x="926" y="300">1인 가구가</text>
      <text x="926" y="332">많이 찾는 소형</text>
    </g>

    <!-- 관리 -->
    <g font-size="22" fill="#292524">
      <text x="248" y="412">관리 주체 있음,</text>
      <text x="248" y="444">대단지 관리비 공개</text>
      <text x="474" y="412">관리 주체 없는</text>
      <text x="474" y="444">경우가 많음</text>
      <text x="700" y="412">집주인이 직접</text>
      <text x="700" y="444">수리·관리</text>
      <text x="926" y="412">관리비 항목별</text>
      <text x="926" y="444">금액 확인 필요</text>
    </g>

    <!-- 시세 확인 -->
    <g font-size="22" fill="#292524">
      <text x="248" y="524">같은 단지 거래로</text>
      <text x="248" y="556">비교 쉬움</text>
      <text x="474" y="524">비슷한 거래</text>
      <text x="474" y="556">찾기 어려움</text>
      <text x="700" y="524">건물마다 달라</text>
      <text x="700" y="556">가장 어려움</text>
      <text x="926" y="524">같은 건물 거래로</text>
      <text x="926" y="556">비교 가능</text>
    </g>

    <!-- 전세사기 피해 비중 -->
    <g font-size="30" font-weight="700" fill="#1c1917">
      <text x="248" y="642">13.5%</text>
      <text x="474" y="642">31.3%</text>
      <text x="700" y="642">29.8%</text>
      <text x="926" y="642">20.8%</text>
    </g>
    <g font-size="22" fill="#57534e">
      <text x="474" y="674">다세대·연립</text>
      <text x="700" y="674">다중주택 포함</text>
    </g>

    <!-- 세금 -->
    <g font-size="22" fill="#292524">
      <text x="248" y="748">취득세</text>
      <text x="248" y="780">주택 세율 1~3%</text>
      <text x="474" y="748">주택 세율 1~3%,</text>
      <text x="474" y="780">소형 신축 특례</text>
      <text x="700" y="748">다가구는</text>
      <text x="700" y="780">집 한 채로 봄</text>
      <text x="926" y="748">취득세 4.6%,</text>
      <text x="926" y="780">주거용이면 주택 수</text>
    </g>

    <g font-size="22" fill="#57534e">
      <text x="64" y="856">전세사기 피해 비중: 2026년 2월 말 누계 36,950건 기준, 근린생활시설·기타 4.6% 제외</text>
      <text x="64" y="896">자료: 국토교통부, 공동주택관리법, 지방세법, 2026-11-11 확인</text>
    </g>
  </g>
</svg>
